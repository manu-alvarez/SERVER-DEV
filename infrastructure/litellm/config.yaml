general_settings:
  master_key: ${LITELLM_MASTER_KEY}
  disable_duplicate_keys: true
  max_parallel_requests: 10
  timeout: 60
  num_retries: 3
  retry: true
  allowed_ips: []

router_settings:
  routing_strategy: simple-shuffle
  max_parallel_requests: 10
  num_retries: 3
  timeout: 60
  retry_after: 1
  allowed_fails: 3

litellm_settings:
  drop_params: true
  request_timeout: 60
  max_tokens: 8192
  debug: false
  set_verbose: false
  suppress_debug_info: true
  async_httpx_client: false
  max_parallel_requests: 10

model_list:

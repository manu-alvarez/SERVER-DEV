      - traefik.http.routers.cuentos.tls.certresolver=myresolver

  # ──────────────────────────────────────────────
  # SSR APPS (Next.js / Direct Docker)
  # ──────────────────────────────────────────────

  mapfre:
    <<: *common
    container_name: mapfre

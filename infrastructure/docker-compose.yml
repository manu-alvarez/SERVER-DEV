networks:
  msbross_net:
    external: true

volumes:
  cuentos-pg-data:
    external: true
  elitescout-pg-data:
    external: true
  jartosdto-minio-data:
    external: true
  jartosdto-pg-data:
    external: true
  jartosdto-redis-data:
    external: true
  portainer_data:
    external: true
  uptime-kuma-data:
    external: true

x-common: &common
  networks:
    - msbross_net
  restart: unless-stopped

x-backend: &backend
  <<: *common

services:

  # ──────────────────────────────────────────────
  # TRAEFIK — REVERSE PROXY (L7, SSL, Security)
  # Managed in infrastructure/traefik/docker-compose.yml
  # ──────────────────────────────────────────────

  # ──────────────────────────────────────────────
  # DATABASES & INFRASTRUCTURE
  # ──────────────────────────────────────────────

  msbross-cuentos-db:
    <<: *common
    container_name: msbross-cuentos-db
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cuentos-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  msbross-elitescout-db:
    <<: *common
    container_name: msbross-elitescout-db
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - elitescout-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  jartosdto-postgres:
    <<: *common
    container_name: jartosdto-postgres
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jartosdto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: jartosdto
    volumes:
      - jartosdto-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jartosdto"]
      interval: 10s
      timeout: 5s
      retries: 5

  jartosdto-redis:
    <<: *common
    container_name: jartosdto-redis
    image: redis:7-alpine
    volumes:
      - jartosdto-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  jartosdto-minio:
    <<: *common
    container_name: jartosdto-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: jartosdto
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - jartosdto-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # BACKEND SERVICES
  # ──────────────────────────────────────────────

  cuentos-magicos-backend:
    <<: *backend
    container_name: cuentos-magicos-backend
    image: msbross-cuentos-magicos-backend:granian
    command: python -m granian app.main:app --host 0.0.0.0 --port 8007 --interface asgi
    depends_on:
      msbross-cuentos-db:
        condition: service_healthy
    env_file:
      - /home/ubuntu/MSBrossAI/apps/cuentos-magicos/.env
    environment:
      - PORT=8007
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@msbross-cuentos-db:5432/cuentos_magicos
      - REDIS_URL=redis://jartosdto-redis:6379/0
    volumes:
      - /home/ubuntu/MSBrossAI/apps/cuentos-magicos/backend:/app
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8007/health').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  cuentos-magicos-celery:
    <<: *backend
    container_name: cuentos-magicos-celery
    image: msbross-cuentos-magicos-backend:granian
    command: python -m celery -A app.core.celery_app worker --loglevel=info --queues=stories,images,audio,video --concurrency=2
    depends_on:
      jartosdto-redis:
        condition: service_healthy
      msbross-cuentos-db:
        condition: service_healthy
    env_file:
      - /home/ubuntu/MSBrossAI/apps/cuentos-magicos/.env
    environment:
      - REDIS_URL=redis://jartosdto-redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@msbross-cuentos-db:5432/cuentos_magicos
    volumes:
      - /home/ubuntu/MSBrossAI/apps/cuentos-magicos/backend:/app

  elitescout-backend:
    <<: *backend
    container_name: elitescout-backend
    image: node:22-alpine
    command: sh start-server.sh
    working_dir: /app
    depends_on:
      msbross-elitescout-db:
        condition: service_healthy
    environment:
      - PORT=8003
    volumes:
      - /home/ubuntu/MSBrossAI/apps/elitescout:/app

  gas-station-backend:
    <<: *backend
    container_name: gas-station-backend
    image: msbross-gas-station-backend:granian
    command: python -m granian main:app --host 0.0.0.0 --port 3005 --interface asgi
    environment:
      - PORT=3005
    volumes:
      - /home/ubuntu/MSBrossAI/apps/gas-station/backend:/app

  iaputa-backend:
    <<: *backend
    container_name: iaputa-backend
    image: msbross-iaputa-backend:granian
    command: python -m granian main:app --host 0.0.0.0 --port 8006 --interface asgi
    env_file:
      - /home/ubuntu/MSBrossAI/apps/iaputa-os/.env
    environment:
      - PORT=8006
    volumes:
      - /home/ubuntu/MSBrossAI/apps/iaputa-os/backend:/app

  industrialpro-backend:
    <<: *backend
    container_name: industrialpro-backend
    image: msbross-industrial-backend:granian
    command: python -m granian app:app --host 0.0.0.0 --port 8002 --interface asgi
    environment:
      - PORT=8002
    volumes:
      - /home/ubuntu/MSBrossAI/apps/industrialpro/backend:/app

  jartosdto-backend:
    <<: *backend
    container_name: jartosdto-backend
    image: msbross-jartosdto-backend:granian
    command: python -m granian app.main:app --host 0.0.0.0 --port 8010 --interface asgi
    depends_on:
      jartosdto-postgres:
        condition: service_healthy
      jartosdto-redis:
        condition: service_healthy
      jartosdto-minio:
        condition: service_healthy
    environment:
      - PORT=8010
    volumes:
      - /home/ubuntu/MSBrossAI/apps/jartosdto/server:/app

  msbross-backend:
    <<: *backend
    container_name: msbross-backend
    image: msbross-msbross:granian
    command: python -m granian app.main:app --host 0.0.0.0 --port 8005 --interface asgi
    environment:
      - PORT=8005
    volumes:
      - /home/ubuntu/MSBrossAI/apps/msbross-backend/server-fastapi:/app
      - /home/ubuntu/MSBrossAI/api_keys_vault.json:/api_keys_vault.json:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.msbross-api.rule=Host(`assistant.manuelalvarez.dev`) && PathPrefix(`/_msbross`)
      - traefik.http.routers.msbross-api.entrypoints=websecure
      - traefik.http.routers.msbross-api.tls.certresolver=myresolver
      - traefik.http.routers.msbross-api.middlewares=strip-msbross
      - traefik.http.middlewares.strip-msbross.stripprefix.prefixes=/_msbross
      - traefik.http.services.msbross-backend.loadbalancer.server.port=8005
      - traefik.http.routers.msbross-api.service=msbross-backend

  nikolina-api-hub:
    <<: *backend
    container_name: nikolina-api-hub
    image: msbross-nikolina-backend:granian
    command: python -m granian main:app --host 0.0.0.0 --port 8001 --interface asgi
    env_file:
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/.env
    environment:
      - PORT=8001
    volumes:
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/server:/app

  nikolina-agent:
    <<: *backend
    container_name: nikolina-agent
    image: msbross-nikolina-backend:latest
    command: python src/agent.py start
    env_file:
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/.env
    environment:
      - PYTHONPATH=/app/src:/server/src
    volumes:
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/agent:/app
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/server:/server

  it-coach-agent:
    <<: *backend
    container_name: it-coach-agent
    image: msbross-nikolina-backend:latest
    command: python src/coach_agent.py start
    env_file:
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/.env
    environment:
      - PYTHONPATH=/app/src:/server/src
      - LIVEKIT_WORKER_PORT=8082
    volumes:
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/agent:/app
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/server:/server
    labels:
      - traefik.enable=true
      - traefik.http.routers.it-coach-agent.rule=Host(`itcoach.manuelalvarez.dev`)
      - traefik.http.routers.it-coach-agent.entrypoints=websecure
      - traefik.http.routers.it-coach-agent.tls.certresolver=myresolver
      - traefik.http.services.it-coach-agent.loadbalancer.server.port=8082

  traductor-backend:
    <<: *backend
    container_name: traductor-backend
    image: msbross-traductor-backend:granian
    command: python -m granian app.main:app --host 0.0.0.0 --port 8004 --interface asgi
    environment:
      - PORT=8004
      - OLLAMA_BASE_URL=http://172.20.0.1:11434/v1
      - OLLAMA_MODEL=qwen2.5:3b
    env_file:
      - /home/ubuntu/MSBrossAI/apps/traductor-pro/.env
    volumes:
      - /home/ubuntu/MSBrossAI/apps/traductor-pro/server-fastapi:/app
    labels:
      - traefik.enable=true
      - traefik.http.routers.traductor-api.rule=Host(`traductor.manuelalvarez.dev`) && PathPrefix(`/_traductor`)
      - traefik.http.routers.traductor-api.entrypoints=websecure
      - traefik.http.routers.traductor-api.tls.certresolver=myresolver
      - traefik.http.routers.traductor-api.middlewares=strip-traductor
      - traefik.http.middlewares.strip-traductor.stripprefix.prefixes=/_traductor
      - traefik.http.services.traductor-api.loadbalancer.server.port=8004
      - traefik.http.routers.traductor-api.service=traductor-api

  it-english-backend:
    <<: *backend
    container_name: it-english-backend
    image: node:22-bookworm-slim
    command: node server.js
    working_dir: /app/apps/it-english-coach
    volumes:
      - /home/ubuntu/MSBrossAI:/app

  # ──────────────────────────────────────────────
  # STATIC APPS VIA MSBROSS PROXY (Node.js :8080)
  # ──────────────────────────────────────────────

  msbross-proxy:
    <<: *common
    container_name: msbross-proxy
    image: node:22-alpine
    command: node proxy_server.js
    working_dir: /app
    environment:
      - NODE_ENV=production
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - /home/ubuntu/MSBrossAI:/app
    labels:
      - traefik.enable=true
      - traefik.http.routers.msbross-proxy-root.rule=Host(`manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-root.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-root.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-elitescout.rule=Host(`elitescout.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-elitescout.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-elitescout.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-elitescout.service=msbross-proxy-svc
      - traefik.http.services.msbross-proxy-svc.loadbalancer.server.port=8080

  # ──────────────────────────────────────────────
  # STATIC APPS (nginx:alpine) — FASE 0
  # ──────────────────────────────────────────────

  app-appgen:
    <<: *common
    container_name: app-appgen
    image: nginx:alpine
    volumes:
      - /home/ubuntu/MSBrossAI/www/app/app-generator:/usr/share/nginx/html:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.appgen.rule=Host(`appgen.manuelalvarez.dev`)
      - traefik.http.routers.appgen.entrypoints=websecure
      - traefik.http.routers.appgen.tls.certresolver=myresolver

  app-assistant:
    <<: *common
    container_name: app-assistant
    image: nginx:alpine
    volumes:
      - /home/ubuntu/MSBrossAI/www/app/assistant:/usr/share/nginx/html:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.assistant.rule=Host(`assistant.manuelalvarez.dev`)
      - traefik.http.routers.assistant.entrypoints=websecure
      - traefik.http.routers.assistant.tls.certresolver=myresolver

  app-combipro:
    <<: *common

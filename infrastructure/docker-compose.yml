networks:
  msbross_net:
    external: true

volumes:
  cuentos-pg-data:
    external: true
  elitescout-pg-data:
    external: true
  jartosdto-minio-data:
    external: true
  jartosdto-pg-data:
    external: true
  jartosdto-redis-data:
    external: true
  portainer_data:
    external: true
  uptime-kuma-data:
    external: true

x-common: &common
  networks:
    - msbross_net
  restart: unless-stopped

x-backend: &backend
  <<: *common

services:

  # ──────────────────────────────────────────────
  # TRAEFIK — REVERSE PROXY (L7, SSL, Security)
  # Managed in infrastructure/traefik/docker-compose.yml
  # ──────────────────────────────────────────────

  # ──────────────────────────────────────────────
  # DATABASES & INFRASTRUCTURE
  # ──────────────────────────────────────────────

  msbross-cuentos-db:
    <<: *common
    container_name: msbross-cuentos-db
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cuentos-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  msbross-elitescout-db:
    <<: *common
    container_name: msbross-elitescout-db
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - elitescout-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  jartosdto-postgres:
    <<: *common
    container_name: jartosdto-postgres
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jartosdto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: jartosdto
    volumes:
      - jartosdto-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jartosdto"]
      interval: 10s
      timeout: 5s
      retries: 5

  jartosdto-redis:
    <<: *common
    container_name: jartosdto-redis
    image: redis:7-alpine
    volumes:
      - jartosdto-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  jartosdto-minio:
    <<: *common
    container_name: jartosdto-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: jartosdto
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - jartosdto-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # BACKEND SERVICES
  # ──────────────────────────────────────────────

  cuentos-magicos-backend:
    <<: *backend
    container_name: cuentos-magicos-backend
    image: msbross-cuentos-magicos-backend:latest
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8007
    depends_on:
      msbross-cuentos-db:
        condition: service_healthy
    env_file:
      - /home/ubuntu/MSBrossAI/apps/cuentos-magicos/.env
    environment:
      - PORT=8007
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@msbross-cuentos-db:5432/cuentos_magicos
      - REDIS_URL=redis://jartosdto-redis:6379/0
    volumes:
      - /home/ubuntu/MSBrossAI/apps/cuentos-magicos/backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  cuentos-magicos-celery:
    <<: *backend
    container_name: cuentos-magicos-celery
    image: msbross-cuentos-magicos-backend:latest
    command: python -m celery -A app.core.celery_app worker --loglevel=info --queues=stories,images,audio,video --concurrency=2
    depends_on:
      jartosdto-redis:
        condition: service_healthy
      msbross-cuentos-db:
        condition: service_healthy
    env_file:
      - /home/ubuntu/MSBrossAI/apps/cuentos-magicos/.env
    environment:
      - REDIS_URL=redis://jartosdto-redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@msbross-cuentos-db:5432/cuentos_magicos
    volumes:
      - /home/ubuntu/MSBrossAI/apps/cuentos-magicos/backend:/app

  elitescout-backend:
    <<: *backend
    container_name: elitescout-backend
    image: node:22-alpine
    command: sh start-server.sh
    working_dir: /app
    depends_on:
      msbross-elitescout-db:
        condition: service_healthy
    environment:
      - PORT=8003
    volumes:
      - /home/ubuntu/MSBrossAI/apps/elitescout:/app

  gas-station-backend:
    <<: *backend
    container_name: gas-station-backend
    image: msbross-gas-station-backend:latest
    command: python -m uvicorn main:app --host 0.0.0.0 --port 3005
    environment:
      - PORT=3005
    volumes:
      - /home/ubuntu/MSBrossAI/apps/gas-station/backend:/app

  iaputa-backend:
    <<: *backend
    container_name: iaputa-backend
    image: msbross-iaputa-backend:latest
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8006
    env_file:
      - /home/ubuntu/MSBrossAI/apps/iaputa-os/.env
    environment:
      - PORT=8006
    volumes:
      - /home/ubuntu/MSBrossAI/apps/iaputa-os/backend:/app

  industrialpro-backend:
    <<: *backend
    container_name: industrialpro-backend
    image: msbross-industrial-backend:latest
    command: python -m uvicorn app:app --host 0.0.0.0 --port 8002
    environment:
      - PORT=8002
    volumes:
      - /home/ubuntu/MSBrossAI/apps/industrialpro/backend:/app

  jartosdto-backend:
    <<: *backend
    container_name: jartosdto-backend
    image: msbross-jartosdto-backend:latest
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8010
    depends_on:
      jartosdto-postgres:
        condition: service_healthy
      jartosdto-redis:
        condition: service_healthy
      jartosdto-minio:
        condition: service_healthy
    environment:
      - PORT=8010
    volumes:
      - /home/ubuntu/MSBrossAI/apps/jartosdto/server:/app

  msbross-backend:
    <<: *backend
    container_name: msbross-backend
    image: msbross-msbross:latest
    command: python server.py
    environment:
      - PORT=8005
    volumes:
      - /home/ubuntu/MSBrossAI/apps/msbross-backend:/app
      - /home/ubuntu/MSBrossAI/api_keys_vault.json:/api_keys_vault.json:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.msbross-backend.rule=Host(`msbross-voice.manuelalvarez.dev`)
      - traefik.http.routers.msbross-backend.entrypoints=websecure
      - traefik.http.routers.msbross-backend.tls.certresolver=myresolver
      - traefik.http.services.msbross-backend.loadbalancer.server.port=8005

  nikolina-api-hub:
    <<: *backend
    container_name: nikolina-api-hub
    image: msbross-nikolina-backend:latest
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8001
    env_file:
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/.env
    environment:
      - PORT=8001
    volumes:
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/server:/app

  nikolina-agent:
    <<: *backend
    container_name: nikolina-agent
    image: msbross-nikolina-backend:latest
    command: python src/agent.py start
    env_file:
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/.env
    environment:
      - PYTHONPATH=/app/src:/server/src
    volumes:
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/agent:/app
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/server:/server

  it-coach-agent:
    <<: *backend
    container_name: it-coach-agent
    image: msbross-nikolina-backend:latest
    command: python src/coach_agent.py start
    env_file:
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/.env
    environment:
      - PYTHONPATH=/app/src:/server/src
      - LIVEKIT_WORKER_PORT=8082
    volumes:
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/agent:/app
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/server:/server
    labels:
      - traefik.enable=true
      - traefik.http.routers.it-coach-agent.rule=Host(`itcoach.manuelalvarez.dev`)
      - traefik.http.routers.it-coach-agent.entrypoints=websecure
      - traefik.http.routers.it-coach-agent.tls.certresolver=myresolver
      - traefik.http.services.it-coach-agent.loadbalancer.server.port=8082

  traductor-backend:
    <<: *backend
    container_name: traductor-backend
    image: node:22-alpine
    command: node dist/index.js
    working_dir: /app
    environment:
      - PORT=8004
    volumes:
      - /home/ubuntu/MSBrossAI/apps/traductor-pro/server:/app

  it-english-backend:
    <<: *backend
    container_name: it-english-backend
    image: node:22-bookworm-slim
    command: node server.js
    working_dir: /app/apps/it-english-coach
    volumes:
      - /home/ubuntu/MSBrossAI:/app

  # ──────────────────────────────────────────────
  # STATIC APPS VIA MSBROSS PROXY (Node.js :8080)
  # ──────────────────────────────────────────────

  msbross-proxy:
    <<: *common
    container_name: msbross-proxy
    image: node:22-alpine
    command: node proxy_server.js
    working_dir: /app
    environment:
      - NODE_ENV=production
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - /home/ubuntu/MSBrossAI:/app
    labels:
      - traefik.enable=true
      - traefik.http.routers.msbross-proxy-root.rule=Host(`manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-root.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-root.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-root.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-assistant.rule=Host(`assistant.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-assistant.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-assistant.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-assistant.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-appgenerator.rule=Host(`appgenerator.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-appgenerator.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-appgenerator.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-appgenerator.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-atenea.rule=Host(`atenea.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-atenea.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-atenea.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-atenea.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-combipro.rule=Host(`combipro.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-combipro.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-combipro.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-combipro.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-cuentos.rule=Host(`cuentos.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-cuentos.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-cuentos.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-cuentos.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-cv.rule=Host(`cv.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-cv.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-cv.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-cv.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-edelweiss.rule=Host(`edelweiss.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-edelweiss.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-edelweiss.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-edelweiss.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-elitescout.rule=Host(`elitescout.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-elitescout.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-elitescout.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-elitescout.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-expositator.rule=Host(`expositator.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-expositator.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-expositator.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-expositator.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-gasstation.rule=Host(`gasstation.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-gasstation.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-gasstation.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-gasstation.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-iaputa.rule=Host(`iaputa.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-iaputa.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-iaputa.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-iaputa.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-industrial.rule=Host(`industrial.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-industrial.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-industrial.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-industrial.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-itenglish.rule=Host(`itenglish.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-itenglish.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-itenglish.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-itenglish.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-jartosdto.rule=Host(`jartosdto.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-jartosdto.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-jartosdto.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-jartosdto.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-logisearch.rule=Host(`logisearch.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-logisearch.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-logisearch.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-logisearch.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-logitrack.rule=Host(`logitrack.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-logitrack.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-logitrack.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-logitrack.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-mano.rule=Host(`mano.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-mano.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-mano.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-mano.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-maya.rule=Host(`maya.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-maya.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-maya.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-maya.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-mokotools.rule=Host(`mokotools.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-mokotools.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-mokotools.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-mokotools.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-nikolina.rule=Host(`nikolina.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-nikolina.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-nikolina.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-nikolina.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-taskflow.rule=Host(`taskflow.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-taskflow.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-taskflow.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-taskflow.service=msbross-proxy-svc
      - traefik.http.routers.msbross-proxy-traductor.rule=Host(`traductor.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-traductor.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-traductor.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-traductor.service=msbross-proxy-svc
      - traefik.http.services.msbross-proxy-svc.loadbalancer.server.port=8080

  # ──────────────────────────────────────────────
  # SSR APPS (Next.js / Direct Docker)
  # ──────────────────────────────────────────────

  mapfre:
    <<: *common
    container_name: mapfre
    image: msbross-mapfre:latest
    labels:
      - traefik.enable=true
      - traefik.http.routers.mapfre.rule=Host(`mapfre.manuelalvarez.dev`) && PathPrefix(`/app/mapfre`)
      - traefik.http.routers.mapfre.entrypoints=websecure
      - traefik.http.routers.mapfre.tls.certresolver=myresolver
      - traefik.http.services.mapfre.loadbalancer.server.port=3333
      - traefik.http.routers.mapfre-redirect.rule=Host(`mapfre.manuelalvarez.dev`) && !PathPrefix(`/app/mapfre`)
      - traefik.http.routers.mapfre-redirect.entrypoints=websecure
      - traefik.http.routers.mapfre-redirect.tls.certresolver=myresolver
      - traefik.http.routers.mapfre-redirect.middlewares=redirect-mapfre
      - traefik.http.middlewares.redirect-mapfre.redirectregex.regex=^https?://([^/]+)/(.*)$$
      - traefik.http.middlewares.redirect-mapfre.redirectregex.replacement=https://$${1}/app/mapfre/$${2}

  perfume-trading:
    <<: *common
    container_name: perfume-trading
    image: msbross-perfume:latest
    environment:
      - SKIP_AUTH=true
    labels:
      - traefik.enable=true
      - traefik.http.routers.perfume.rule=Host(`perfume.manuelalvarez.dev`) && PathPrefix(`/app/perfume-trading`)
      - traefik.http.routers.perfume.entrypoints=websecure
      - traefik.http.routers.perfume.tls.certresolver=myresolver
      - traefik.http.services.perfume.loadbalancer.server.port=3000
      - traefik.http.routers.perfume-redirect.rule=Host(`perfume.manuelalvarez.dev`) && !PathPrefix(`/app/perfume-trading`)
      - traefik.http.routers.perfume-redirect.entrypoints=websecure
      - traefik.http.routers.perfume-redirect.tls.certresolver=myresolver
      - traefik.http.routers.perfume-redirect.middlewares=redirect-perfume
      - traefik.http.middlewares.redirect-perfume.redirectregex.regex=^https?://([^/]+)/(.*)$$
      - traefik.http.middlewares.redirect-perfume.redirectregex.replacement=https://$${1}/app/perfume-trading/$${2}

  txa-fitness-pro:
    <<: *common
    container_name: txa-fitness-pro
    image: msbross-fitness:latest
    labels:
      - traefik.enable=true
      - traefik.http.routers.txafitness.rule=Host(`txafitness.manuelalvarez.dev`) && PathPrefix(`/app/txafitnesspro`)
      - traefik.http.routers.txafitness.entrypoints=websecure
      - traefik.http.routers.txafitness.tls.certresolver=myresolver
      - traefik.http.services.txafitness.loadbalancer.server.port=3000
      - traefik.http.routers.txafitness-redirect.rule=Host(`txafitness.manuelalvarez.dev`) && !PathPrefix(`/app/txafitnesspro`)
      - traefik.http.routers.txafitness-redirect.entrypoints=websecure
      - traefik.http.routers.txafitness-redirect.tls.certresolver=myresolver
      - traefik.http.routers.txafitness-redirect.middlewares=redirect-txafitness
      - traefik.http.middlewares.redirect-txafitness.redirectregex.regex=^https?://([^/]+)/(.*)$$
      - traefik.http.middlewares.redirect-txafitness.redirectregex.replacement=https://$${1}/app/txafitnesspro/$${2}

  # ──────────────────────────────────────────────
  # MONITORING & MANAGEMENT
  # ──────────────────────────────────────────────

  portainer:
    <<: *common
    container_name: portainer
    image: portainer/portainer-ce:lts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`portainer.manuelalvarez.dev`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls.certresolver=myresolver
      - traefik.http.services.portainer.loadbalancer.server.port=9000

  uptime-kuma:
    <<: *common
    container_name: uptime-kuma
    image: louislam/uptime-kuma:1
    volumes:
      - uptime-kuma-data:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.kuma.rule=Host(`monitor.manuelalvarez.dev`)

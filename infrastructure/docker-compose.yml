    - traefik.http.routers.msbross-proxy-cuentos.tls.certresolver=myresolver
    - traefik.http.routers.msbross-proxy-proxy.tls.certresolver=myresolver
    - traefik.http.routers.proxy-taskflow.service=msbross-proxy-svc
    - traefik.http.routers.proxy-logisearch.service=msbross-proxy-svc
    - traefik.http.routers.proxy-alphatrader.service=msbross-proxy-svc
    - traefik.http.routers.msbross-proxy-edelweiss.rule=Host(`edelweiss.manuelalvarez.dev`)
    - traefik.http.routers.msbross-proxy-edelweiss.entrypoints=websecure
    - traefik.http.routers.msbross-proxy-edelweiss.tls.certresolver=myresolver
    - traefik.http.routers.msbross-proxy-edelweiss.service=msbross-proxy-svc
    - traefik.http.routers.msbross-proxy-cv.rule=Host(`cv.manuelalvarez.dev`)
    - traefik.http.routers.msbross-proxy-cv.entrypoints=websecure
    - traefik.http.routers.msbross-proxy-cv.tls.certresolver=myresolver
    - traefik.http.routers.msbross-proxy-cv.service=msbross-proxy-svc
    networks: *id001
    ports:
    - 127.0.0.1:8080:8080
    restart: unless-stopped
    volumes:
    - /home/ubuntu/MSBrossAI:/app
    working_dir: /app
  nikolina-agent:
    command: python src/agent.py start
    container_name: nikolina-agent
    env_file:
    - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/.env
    environment:
    - PYTHONPATH=/app/src:/server/src
    image: msbross-nikolina-backend:latest
    networks: *id001
    restart: unless-stopped
    volumes:
    - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/agent:/app
    - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/server:/server
  nikolina-api-hub:
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8001
    container_name: nikolina-api-hub
    env_file:
    - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/.env
    environment:
    - PORT=8001
    image: msbross-nikolina-backend:latest
    networks: *id001
    restart: unless-stopped
    volumes:
    - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/server:/app
  perfume-trading:
    container_name: perfume-trading
    image: msbross-perfume:latest
    environment:
      - SKIP_AUTH=true
    networks:
      - msbross_net
    restart: unless-stopped
    labels:
    - traefik.enable=true
    - traefik.http.routers.perfume.rule=Host(`perfume.manuelalvarez.dev`) && PathPrefix(`/app/perfume-trading`)
    - traefik.http.routers.perfume.entrypoints=websecure
    - traefik.http.routers.perfume.tls.certresolver=myresolver
    - traefik.http.services.perfume.loadbalancer.server.port=3011

    - traefik.http.routers.perfume-redirect.rule=Host(`perfume.manuelalvarez.dev`) && !PathPrefix(`/app/perfume-trading`)
    - traefik.http.routers.perfume-redirect.entrypoints=websecure
    - traefik.http.routers.perfume-redirect.tls.certresolver=myresolver
    - traefik.http.routers.perfume-redirect.middlewares=redirect-perfume
    - traefik.http.middlewares.redirect-perfume.redirectregex.regex=^https?://([^/]+)/(.*)$$
    - traefik.http.middlewares.redirect-perfume.redirectregex.replacement=https://$${1}/app/perfume-trading/$${2}
  traductor-backend:
    command: node dist/index.js
    container_name: traductor-backend
    environment:
    - PORT=8004
    image: node:22-alpine
    networks: *id001
    restart: unless-stopped
    volumes:
    - /home/ubuntu/MSBrossAI/apps/traductor-pro/server:/app
    working_dir: /app
  txa-fitness-pro:
    container_name: txa-fitness-pro
    image: msbross-fitness:latest
    networks: *id001
    restart: unless-stopped
    labels:
    - traefik.enable=true
    - traefik.http.routers.txafitness.rule=Host(`txafitness.manuelalvarez.dev`) && PathPrefix(`/app/txafitnesspro`)
    - traefik.http.routers.txafitness.entrypoints=websecure
    - traefik.http.routers.txafitness.tls.certresolver=myresolver
    - traefik.http.services.txafitness.loadbalancer.server.port=3456

    - traefik.http.routers.txafitness-redirect.rule=Host(`txafitness.manuelalvarez.dev`) && !PathPrefix(`/app/txafitnesspro`)
    - traefik.http.routers.txafitness-redirect.entrypoints=websecure
    - traefik.http.routers.txafitness-redirect.tls.certresolver=myresolver
    - traefik.http.routers.txafitness-redirect.middlewares=redirect-txafitness
    - traefik.http.middlewares.redirect-txafitness.redirectregex.regex=^https?://([^/]+)/(.*)$$
    - traefik.http.middlewares.redirect-txafitness.redirectregex.replacement=https://$${1}/app/txafitnesspro/$${2}
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    networks:
    - msbross_net
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - portainer_data:/data
    labels:
    - traefik.enable=true
    - traefik.http.routers.portainer.rule=Host(`portainer.manuelalvarez.dev`)
    - traefik.http.routers.portainer.entrypoints=websecure
    - traefik.http.routers.portainer.tls.certresolver=myresolver
    - traefik.http.services.portainer.loadbalancer.server.port=9000
  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    networks:
    - msbross_net
    volumes:
    - uptime-kuma-data:/app/data
    labels:
    - traefik.enable=true
    - traefik.http.routers.kuma.rule=Host(`monitor.manuelalvarez.dev`)
    - traefik.http.routers.kuma.entrypoints=websecure
    - traefik.http.routers.kuma.tls.certresolver=myresolver
    - traefik.http.services.kuma.loadbalancer.server.port=3001
version: '3.8'
volumes:
  cuentos-pg-data:
    external: true
  elitescout-pg-data:
    external: true
  jartosdto-minio-data:
    external: true
  jartosdto-pg-data:
    external: true
  jartosdto-redis-data:
    external: true
  portainer_data:
    external: true
  uptime-kuma-data:
    external: true
x-backend-common:
  networks: *id001
  restart: unless-stopped

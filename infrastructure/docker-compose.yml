networks:
  msbross_net:
    external: true

volumes:
  uiep-backend-data:
  cuentos-pg-data:
    external: true
  elitescout-pg-data:
    external: true
  jartosdto-minio-data:
    external: true
  jartosdto-pg-data:
    external: true
  jartosdto-redis-data:
    external: true
  portainer_data:
    external: true
  uptime-kuma-data:
    external: true

x-common: &common
  networks:
    - msbross_net
  restart: unless-stopped

x-backend: &backend
  <<: *common

services:

  # ──────────────────────────────────────────────
  # TRAEFIK — REVERSE PROXY (L7, SSL, Security)
  # Managed in infrastructure/traefik/docker-compose.yml
  # ──────────────────────────────────────────────

  # ──────────────────────────────────────────────
  # DATABASES & INFRASTRUCTURE
  # ──────────────────────────────────────────────

  msbross-cuentos-db:
    <<: *common
    container_name: msbross-cuentos-db
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cuentos-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  jartosdto-redis:
    <<: *common
    container_name: jartosdto-redis
    image: redis:7-alpine
    volumes:
      - jartosdto-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  cuentos-magicos-backend:
    <<: *backend
    container_name: cuentos-magicos-backend
    image: msbross-cuentos-magicos-backend:granian
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8007
    depends_on:
      msbross-cuentos-db:
        condition: service_healthy
    env_file:
      - /home/ubuntu/MSBrossAI/apps/cuentos-magicos/.env
    environment:
      - PORT=8007
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@msbross-cuentos-db:5432/cuentos_magicos
      - REDIS_URL=redis://jartosdto-redis:6379/0
    volumes:
      - /home/ubuntu/MSBrossAI/apps/cuentos-magicos/backend:/app
      - /home/ubuntu/MSBrossAI/apps/cuentos-magicos/storage:/storage
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8007/health').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  cuentos-magicos-celery:
    <<: *backend
    container_name: cuentos-magicos-celery
    image: msbross-cuentos-magicos-backend:granian
    command: python -m celery -A app.core.celery_app worker --loglevel=info --queues=stories,images,audio,video --concurrency=2
    depends_on:
      jartosdto-redis:
        condition: service_healthy
      msbross-cuentos-db:
        condition: service_healthy
    env_file:
      - /home/ubuntu/MSBrossAI/apps/cuentos-magicos/.env
    environment:
      - REDIS_URL=redis://jartosdto-redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@msbross-cuentos-db:5432/cuentos_magicos
    volumes:
      - /home/ubuntu/MSBrossAI/apps/cuentos-magicos/backend:/app
      - /home/ubuntu/MSBrossAI/apps/cuentos-magicos/storage:/storage

  gas-station-backend:
    <<: *backend
    container_name: gas-station-backend
    image: msbross-gas-station-backend:granian
    command: sh -c "pip install -r requirements.txt && python -m uvicorn main:app --host 0.0.0.0 --port 3005"
    environment:
      - PORT=3005
    volumes:
      - /home/ubuntu/MSBrossAI/apps/gas-station/backend:/app

  nikolina-api-hub:
    <<: *backend
    container_name: nikolina-api-hub
    image: msbross-nikolina-backend:granian
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8001
    env_file:
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/.env
    environment:
      - PORT=8001
    volumes:
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/server:/app

  nikolina-agent:
    <<: *backend
    container_name: nikolina-agent
    image: msbross-nikolina-backend:latest
    command: python src/agent.py start
    env_file:
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/.env
    environment:
      - PYTHONPATH=/app/src:/server/src
    volumes:
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/agent:/app
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/server:/server

  msbross-proxy:
    <<: *common
    container_name: msbross-proxy
    image: node:22-alpine
    command: node infrastructure/msbross-proxy/proxy_server.js
    working_dir: /app
    environment:
      - NODE_ENV=production
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - /home/ubuntu/MSBrossAI:/app
    labels:
      - traefik.enable=true
      - traefik.http.routers.msbross-proxy-root.rule=Host(`manuelalvarez.dev`) || Host(`appgen.manuelalvarez.dev`) || Host(`assistant.manuelalvarez.dev`) || Host(`combipro.manuelalvarez.dev`) || Host(`cv.manuelalvarez.dev`) || Host(`edelweiss.manuelalvarez.dev`) || Host(`expositator.manuelalvarez.dev`) || Host(`gasstation.manuelalvarez.dev`) || Host(`iaprod.manuelalvarez.dev`) || Host(`industrial.manuelalvarez.dev`) || Host(`itenglish.manuelalvarez.dev`) || Host(`jartosdto.manuelalvarez.dev`) || Host(`logisearch.manuelalvarez.dev`) || Host(`logitrack.manuelalvarez.dev`) || Host(`mano.manuelalvarez.dev`) || Host(`maya.manuelalvarez.dev`) || Host(`mokotools.manuelalvarez.dev`) || Host(`nikolina.manuelalvarez.dev`) || Host(`taskflow.manuelalvarez.dev`) || Host(`traductor.manuelalvarez.dev`) || Host(`cuentos.manuelalvarez.dev`) || Host(`elitescout.manuelalvarez.dev`) || Host(`atenea.manuelalvarez.dev`) || Host(`uiep.manuelalvarez.dev`) || Host(`tarot.manuelalvarez.dev`) || Host(`teringo.manuelalvarez.dev`) || Host(`foz.manuelalvarez.dev`)
      - traefik.http.routers.msbross-proxy-root.entrypoints=websecure
      - traefik.http.routers.msbross-proxy-root.tls.certresolver=myresolver
      - traefik.http.routers.msbross-proxy-root.middlewares=strip-quic,sec-headers
      - traefik.http.routers.msbross-proxy-root.service=msbross-proxy-svc
      - traefik.http.services.msbross-proxy-svc.loadbalancer.server.port=8080

  portainer:
    <<: *common
    container_name: portainer
    image: portainer/portainer-ce:lts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`portainer.manuelalvarez.dev`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls.certresolver=myresolver
      - traefik.http.services.portainer.loadbalancer.server.port=9000
      - traefik.http.routers.portainer.middlewares=admin-auth
      - traefik.http.middlewares.admin-auth.basicauth.users=admin:$$apr1$$tsube.dv$$ntEzPeXD8lwJK5E5SQbGF1

  uptime-kuma:
    <<: *common
    container_name: uptime-kuma
    image: louislam/uptime-kuma:1
    volumes:
      - uptime-kuma-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - traefik.enable=true
      - traefik.http.routers.kuma.rule=Host(`monitor.manuelalvarez.dev`)
      - traefik.http.routers.kuma.entrypoints=websecure
      - traefik.http.routers.kuma.tls.certresolver=myresolver
      - traefik.http.routers.kuma.middlewares=admin-auth
      - traefik.http.services.kuma.loadbalancer.server.port=3001

  # ──────────────────────────────────────────────
  # UIEP — INTELLIGENCE ENGINEERING PLATFORM
  # Backend (Express, node:22-alpine) — servido por el proxy en /_uiep
  # Despliegue real: build del monorepo apps/uiep con dockerfile backend/Dockerfile
  # (Fase 0: multi-stage, workspace pnpm), red msbross_net, alias DNS uiep-backend,
  # sin puertos publicados al host.
  # ──────────────────────────────────────────────

  uiep-backend:
    <<: *backend
    build:
      context: ../apps/uiep
      dockerfile: backend/Dockerfile
    image: msbrossai-uiep-backend
    container_name: uiep-backend
    environment:
      - PORT=4000
      - NODE_ENV=production
      - OLLAMA_BASE_URL=${UIEP_OLLAMA_BASE_URL:-http://172.20.0.1:11434}
      - UIEP_RUNTIME_TOKEN=${UIEP_RUNTIME_TOKEN:-}
      - UIEP_CONSOLE_PASSWORD=${UIEP_CONSOLE_PASSWORD:-}
      - UIEP_HOOKS=${UIEP_HOOKS:-}
      - UIEP_HOOK_TOKEN_1=${UIEP_HOOK_TOKEN_1:-}
      - UIEP_MCP_EXPOSED_TOOLS=${UIEP_MCP_EXPOSED_TOOLS:-}
    volumes:
      - uiep-backend-data:/app/data

version: '3.8'

networks:
  msbross_net:
    external: true
services:
  cuentos-magicos-backend:
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8007
    container_name: cuentos-magicos-backend
    depends_on:
    - msbross-cuentos-db
    environment:
    - PORT=8007
    - DATABASE_URL=postgresql+asyncpg://postgres:postgres@msbross-cuentos-db:5432/cuentos_magicos
    image: msbross-cuentos-magicos-backend:latest
    networks: &id001
    - msbross_net
    restart: unless-stopped
    volumes:
    - /home/ubuntu/MSBrossAI/apps/cuentos-magicos/backend:/app
  elitescout-backend:
    command: sh start-server.sh
    container_name: elitescout-backend
    depends_on:
    - msbross-elitescout-db
    environment:
    - PORT=8003
    image: node:22-alpine
    networks: *id001
    restart: unless-stopped
    volumes:
    - /home/ubuntu/MSBrossAI/apps/elitescout:/app
    working_dir: /app
  gas-station-backend:
    command: python -m uvicorn main:app --host 0.0.0.0 --port 3005
    container_name: gas-station-backend
    environment:
    - PORT=3005
    image: msbross-gas-station-backend:latest
    networks: *id001
    restart: unless-stopped
    volumes:
    - /home/ubuntu/MSBrossAI/apps/gas-station/backend:/app
  iaputa-backend:
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8006
    container_name: iaputa-backend
    environment:
    - PORT=8006
    image: msbross-iaputa-backend:latest
    networks: *id001
    restart: unless-stopped
    volumes:
    - /home/ubuntu/MSBrossAI/apps/iaputa-os/backend:/app
  industrialpro-backend:
    command: python -m uvicorn app:app --host 0.0.0.0 --port 8002
    container_name: industrialpro-backend
    environment:
    - PORT=8002
    image: msbross-industrial-backend:latest
    networks: *id001
    restart: unless-stopped
    volumes:
    - /home/ubuntu/MSBrossAI/apps/industrialpro/backend:/app
  it-coach-agent:
    command: python src/coach_agent.py start
    container_name: it-coach-agent
    env_file:
    - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/.env
    environment:
    - PYTHONPATH=/app/src:/server/src
    - LIVEKIT_WORKER_PORT=8082
    image: msbross-nikolina-backend:latest
    labels:
    - traefik.enable=true
    - traefik.http.routers.it-coach-agent.rule=Host(`itcoach.manuelalvarez.dev`)
    - traefik.http.routers.it-coach-agent.entrypoints=websecure
    - traefik.http.routers.it-coach-agent.tls.certresolver=myresolver
    - traefik.http.services.it-coach-agent.loadbalancer.server.port=8082
    networks: *id001
    restart: unless-stopped
    volumes:
    - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/agent:/app
    - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/server:/server
  it-english-backend:
    command: node server.js
    container_name: it-english-backend
    image: node:22-bookworm-slim
    networks: *id001
    restart: unless-stopped
    volumes:
    - /home/ubuntu/MSBrossAI:/app
    working_dir: /app/apps/it-english-coach
  jartosdto-backend:
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8010
    container_name: jartosdto-backend
    depends_on:
    - jartosdto-postgres
    - jartosdto-redis
    - jartosdto-minio
    environment:
    - PORT=8010
    image: msbross-jartosdto-backend:latest
    networks: *id001
    restart: unless-stopped
    volumes:
    - /home/ubuntu/MSBrossAI/apps/jartosdto/server:/app
  jartosdto-minio:
    command: server /data --console-address ":9001"
    container_name: jartosdto-minio
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER: jartosdto
    image: minio/minio:latest
    networks: *id001
    restart: unless-stopped
    volumes:
    - jartosdto-minio-data:/data
  jartosdto-postgres:
    container_name: jartosdto-postgres
    environment:
      POSTGRES_DB: jartosdto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: jartosdto
    image: pgvector/pgvector:pg16
    networks: *id001
    restart: unless-stopped
    volumes:
    - jartosdto-pg-data:/var/lib/postgresql/data
  jartosdto-redis:
    container_name: jartosdto-redis
    image: redis:7-alpine
    networks: *id001
    restart: unless-stopped
    volumes:
    - jartosdto-redis-data:/data
  mapfre:
    container_name: mapfre
    image: msbross-mapfre:latest
    networks: *id001
    restart: unless-stopped
    labels:
    - traefik.enable=true
    - traefik.http.routers.mapfre.rule=Host(`mapfre.manuelalvarez.dev`) && PathPrefix(`/app/mapfre`)
    - traefik.http.routers.mapfre.entrypoints=websecure
    - traefik.http.routers.mapfre.tls.certresolver=myresolver
    - traefik.http.services.mapfre.loadbalancer.server.port=3333

    - traefik.http.routers.mapfre-redirect.rule=Host(`mapfre.manuelalvarez.dev`) && !PathPrefix(`/app/mapfre`)
    - traefik.http.routers.mapfre-redirect.entrypoints=websecure
    - traefik.http.routers.mapfre-redirect.tls.certresolver=myresolver
    - traefik.http.routers.mapfre-redirect.middlewares=redirect-mapfre
    - traefik.http.middlewares.redirect-mapfre.redirectregex.regex=^https?://([^/]+)/(.*)$$
    - traefik.http.middlewares.redirect-mapfre.redirectregex.replacement=https://$${1}/app/mapfre/$${2}
  msbross-backend:
    command: python server.py
    container_name: msbross-backend
    environment:
    - PORT=8005
    image: msbross-msbross:latest
    labels:
    - traefik.enable=true
    - traefik.http.routers.msbross-backend.rule=Host(`msbross-voice.manuelalvarez.dev`)
    - traefik.http.routers.msbross-backend.entrypoints=websecure
    - traefik.http.routers.msbross-backend.tls.certresolver=myresolver
    - traefik.http.services.msbross-backend.loadbalancer.server.port=8005
    networks: *id001
    restart: unless-stopped
    volumes:
    - /home/ubuntu/MSBrossAI/apps/msbross:/app
  msbross-cuentos-db:
    container_name: msbross-cuentos-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    image: postgres:16-alpine
    networks: *id001
    restart: unless-stopped
    volumes:
    - cuentos-pg-data:/var/lib/postgresql/data
  msbross-elitescout-db:
    container_name: msbross-elitescout-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    image: postgres:16-alpine
    networks: *id001
    restart: unless-stopped
    volumes:
    - elitescout-pg-data:/var/lib/postgresql/data
  msbross-proxy:
    command: node proxy_server.js
    container_name: msbross-proxy
    environment:
    - NODE_ENV=production
    extra_hosts:
    - host.docker.internal:host-gateway
    image: node:22-alpine
    labels:
    - traefik.http.routers.proxy-taskflow.tls.certresolver=myresolver
    - traefik.http.routers.msbross-proxy-expositator.rule=Host(`expositator.manuelalvarez.dev`)
    - traefik.http.routers.msbross-proxy-logitrack.tls.certresolver=myresolver
    - traefik.http.routers.msbross-proxy-mano.rule=Host(`mano.manuelalvarez.dev`)
    - traefik.http.routers.msbross-proxy-combipro.rule=Host(`combipro.manuelalvarez.dev`)
    - traefik.http.routers.msbross-proxy-gasstation.service=msbross-proxy-svc
    - traefik.http.routers.msbross-proxy-elitescout.service=msbross-proxy-svc
    - traefik.http.routers.msbross-proxy-jartosdto.rule=Host(`jartosdto.manuelalvarez.dev`)
    - traefik.http.routers.msbross-proxy-industrial.rule=Host(`industrial.manuelalvarez.dev`)
    - traefik.http.routers.msbross-proxy-expositator.service=msbross-proxy-svc
    - traefik.http.routers.proxy-alphatrader.rule=Host(`alphatrader.manuelalvarez.dev`)
    - traefik.http.routers.msbross-proxy-logitrack.service=msbross-proxy-svc
    - traefik.http.routers.msbross-proxy-logitrack.rule=Host(`logitrack.manuelalvarez.dev`)
    - traefik.http.routers.proxy-cyberguard.entrypoints=websecure
    - traefik.http.routers.msbross-proxy-itenglish.rule=Host(`itenglish.manuelalvarez.dev`)
    - traefik.http.routers.msbross-proxy-nikolina.tls.certresolver=myresolver
    - traefik.http.routers.msbross-proxy-appgenerator.rule=Host(`appgenerator.manuelalvarez.dev`)
    - traefik.http.routers.msbross-proxy-jartosdto.entrypoints=websecure
    - traefik.http.routers.msbross-proxy-industrial.entrypoints=websecure
    - traefik.http.routers.msbross-proxy-logitrack.entrypoints=websecure
    - traefik.http.routers.msbross-proxy-nikolina.rule=Host(`nikolina.manuelalvarez.dev`)
    - traefik.http.routers.msbross-proxy-expositator.entrypoints=websecure
    - traefik.http.routers.msbross-proxy-cuentos.rule=Host(`cuentos.manuelalvarez.dev`)
    - traefik.http.routers.proxy-logisearch.rule=Host(`logisearch.manuelalvarez.dev`)
    - traefik.http.routers.msbross-proxy-traductor.tls.certresolver=myresolver
    - traefik.http.routers.msbross-proxy-industrial.tls.certresolver=myresolver
    - traefik.http.routers.msbross-proxy-mokotools.entrypoints=websecure
    - traefik.http.routers.proxy-cyberguard.rule=Host(`cyberguard.manuelalvarez.dev`)
    - traefik.http.routers.msbross-proxy-iaputa.tls.certresolver=myresolver
    - traefik.http.routers.msbross-proxy-mano.entrypoints=websecure
    - traefik.http.routers.msbross-proxy-mokotools.rule=Host(`mokotools.manuelalvarez.dev`)
    - traefik.http.routers.msbross-proxy-jartosdto.service=msbross-proxy-svc
    - traefik.http.routers.msbross-proxy-combipro.entrypoints=websecure
    - traefik.http.routers.msbross-proxy-proxy.service=msbross-proxy-svc
    - traefik.http.routers.msbross-proxy-atenea.tls.certresolver=myresolver

    - traefik.http.routers.msbross-proxy-nikolina.service=msbross-proxy-svc
    - traefik.http.routers.proxy-taskflow.entrypoints=websecure
    - traefik.http.routers.msbross-proxy-appgenerator.entrypoints=websecure
    - traefik.http.services.msbross-proxy-svc.loadbalancer.server.port=8080
    - traefik.http.routers.msbross-proxy-cuentos.service=msbross-proxy-svc
    - traefik.http.routers.proxy-alphatrader.entrypoints=websecure
    - traefik.http.routers.msbross-proxy-itenglish.tls.certresolver=myresolver
    - traefik.http.routers.msbross-proxy-industrial.service=msbross-proxy-svc
    - traefik.enable=true
    - traefik.http.routers.msbross-proxy-iaputa.service=msbross-proxy-svc
    - traefik.http.routers.msbross-proxy-elitescout.tls.certresolver=myresolver
    - traefik.http.routers.msbross-proxy-atenea.service=msbross-proxy-svc
    - traefik.http.routers.msbross-proxy-itenglish.entrypoints=websecure
    - traefik.http.routers.msbross-proxy-mano.tls.certresolver=myresolver
    - traefik.http.routers.msbross-proxy-cuentos.entrypoints=websecure
    - traefik.http.routers.msbross-proxy-proxy.entrypoints=websecure
    - traefik.http.routers.msbross-proxy-iaputa.entrypoints=websecure
    - traefik.http.routers.msbross-proxy-mokotools.tls.certresolver=myresolver
    - traefik.http.routers.msbross-proxy-iaputa.rule=Host(`iaputa.manuelalvarez.dev`)
    - traefik.http.routers.proxy-logisearch.tls.certresolver=myresolver
    - traefik.http.routers.msbross-proxy-mokotools.service=msbross-proxy-svc
    - traefik.http.routers.proxy-alphatrader.tls.certresolver=myresolver
    - traefik.http.routers.msbross-proxy-gasstation.rule=Host(`gasstation.manuelalvarez.dev`)
    - traefik.http.routers.msbross-proxy-proxy.rule=Host(`proxy.manuelalvarez.dev`)
    - traefik.http.routers.msbross-proxy-atenea.rule=Host(`atenea.manuelalvarez.dev`)
    - traefik.http.routers.msbross-proxy-mano.service=msbross-proxy-svc
    - traefik.http.routers.msbross-proxy-nikolina.entrypoints=websecure
    - traefik.http.routers.msbross-proxy-appgenerator.service=msbross-proxy-svc
    - traefik.http.routers.proxy-logisearch.entrypoints=websecure
    - traefik.http.routers.msbross-proxy-atenea.entrypoints=websecure
    - traefik.http.routers.msbross-proxy-gasstation.entrypoints=websecure

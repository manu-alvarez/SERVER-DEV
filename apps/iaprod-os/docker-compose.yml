version: '3.8'

services:
  iaprod-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    ports:
      - "8006:8006"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8006
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-iaprod-local-secret-change-in-production}
      - IAPROD_API_KEY=${IAPROD_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GOOGLE_STUDIO_API_KEY=${GOOGLE_STUDIO_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_DEFAULT_CHAT_ID=${TELEGRAM_DEFAULT_CHAT_ID:-}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped
    networks:
      - iaprod-net

  iaprod-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "3001:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8006
    restart: unless-stopped
    depends_on:
      - iaprod-backend
    networks:
      - iaprod-net

networks:
  iaprod-net:
    driver: bridge

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#grad)" />
  
  <g transform="translate(14, 14) scale(3)">
    <!-- Server stack base -->
    <rect x="2" y="16" width="20" height="6" rx="2" ry="2" fill="none" stroke="white" stroke-width="2"/>
    <rect x="2" y="8" width="20" height="6" rx="2" ry="2" fill="none" stroke="white" stroke-width="2"/>
    <rect x="2" y="0" width="20" height="6" rx="2" ry="2" fill="none" stroke="white" stroke-width="2"/>
    <!-- M-shape network lines connecting them -->
    <path d="M 6 3 L 12 11 L 18 3" stroke="white" stroke-width="2" fill="none" />
    <path d="M 6 11 L 12 19 L 18 11" stroke="white" stroke-width="2" fill="none" />
    <!-- Glowing nodes -->
    <circle cx="12" cy="11" r="1.5" fill="white" stroke="none" />
    <circle cx="12" cy="19" r="1.5" fill="white" stroke="none" />
    <circle cx="6" cy="3" r="1.5" fill="white" stroke="none" />
    <circle cx="18" cy="3" r="1.5" fill="white" stroke="none" />
  </g>
</svg>
services:
  app-generator-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-generator-prod
    restart: unless-stopped
    networks:
      - msbross_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.appgenerator.rule=Host(`appgen.manuelalvarez.dev`)"
      - "traefik.http.routers.appgenerator.entrypoints=websecure"
      - "traefik.http.routers.appgenerator.tls.certresolver=myresolver"
      - "traefik.http.routers.appgenerator.priority=999"
      - "traefik.http.services.appgenerator.loadbalancer.server.port=80"
      - "traefik.docker.network=msbross_net"

networks:
  msbross_net:
    external: true

services:
  combipro-frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: combipro-frontend-prod
    restart: unless-stopped
    networks:
      - msbross_net
    labels:
      - "traefik.enable=true"
      # Routers
      - "traefik.http.routers.combipro.rule=Host(`combipro.manuelalvarez.dev`)"
      - "traefik.http.routers.combipro.entrypoints=websecure"
      - "traefik.http.routers.combipro.tls.certresolver=myresolver"
      # Services
      - "traefik.http.services.combipro.loadbalancer.server.port=80"
      # Priority in case of conflicts
      - "traefik.http.routers.combipro.priority=999"
      - "traefik.docker.network=msbross_net"

networks:
  msbross_net:
    external: true

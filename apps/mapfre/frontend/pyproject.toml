[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gestion"
version = "1.0.0-beta"
description = "MAPFRE Gestión claim form automation - AI-powered expediente processing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mapfre", "gestion", "automation", "insurance", "claims"]
authors = [
    { name = "MAPFRE GESTION Team" },
]

dependencies = [
    "playwright>=1.40",
    "anthropic>=0.30",
    "click>=8.0",
    "rich>=13.0",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "cryptography>=41.0",
]

[project.scripts]
gestion = "gestion.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

# UIEP — compose homologado con el despliegue real en el VPS (octubre 2026).
#
# - El frontend NO corre como contenedor: se sirve como estático desde
#   www/app/uiep vía msbross-proxy (no existe servicio uiep-web en producción).
# - El backend se construye desde apps/uiep/backend (node:22-alpine, Dockerfile
#   simple que copia server.js). El Dockerfile.backend del monorepo (node:20 +
#   dist) NO es el que corre en producción, pese a aparecer en versiones previas.
# - Backend en la red externa msbross_net con alias DNS `uiep-backend`;
#   el proxy lo consulta en http://uiep-backend:4000 para la ruta API /_uiep.
# - Sin puertos publicados al host (acceso solo interno de red Docker);
#   el host lo expone a través de Traefik -> proxy:8080.

services:
  uiep-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: msbrossai-uiep-backend
    container_name: uiep-backend
    restart: unless-stopped
    environment:
      - PORT=4000
      - NODE_ENV=production
      - OLLAMA_BASE_URL=${UIEP_OLLAMA_BASE_URL:-http://172.20.0.1:11434}
      - UIEP_RUNTIME_TOKEN=${UIEP_RUNTIME_TOKEN:-}
      - UIEP_CONSOLE_PASSWORD=${UIEP_CONSOLE_PASSWORD:-}
      - UIEP_HOOKS=${UIEP_HOOKS:-}
      - UIEP_HOOK_TOKEN_1=${UIEP_HOOK_TOKEN_1:-}
      - UIEP_MCP_EXPOSED_TOOLS=${UIEP_MCP_EXPOSED_TOOLS:-}
    volumes:
      - uiep-backend-data:/app/data
    networks:
      - msbross_net

networks:
  msbross_net:
    external: true

volumes:
  uiep-backend-data:

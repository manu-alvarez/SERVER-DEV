version: '3.8'

services:
  uiep-backend:
    build:
      context: ..
      dockerfile: Dockerfile.backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - uiep-net

  uiep-web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.web
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:4000
    restart: unless-stopped
    depends_on:
      - uiep-backend
    networks:
      - uiep-net

networks:
  uiep-net:
    driver: bridge

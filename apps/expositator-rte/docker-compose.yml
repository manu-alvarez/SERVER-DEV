services:
  expositator-frontend:
    build: .
    container_name: expositator-frontend
    restart: unless-stopped
    networks:
      - msbross_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.expositator.rule=Host(`expositator.manuelalvarez.dev`)"
      - "traefik.http.routers.expositator.entrypoints=websecure"
      - "traefik.http.routers.expositator.tls.certresolver=production"
      - "traefik.http.services.expositator.loadbalancer.server.port=80"

networks:
  msbross_net:
    external: true

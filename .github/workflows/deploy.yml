name: Deploy Frontend to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'apps/msbross-frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm ci
      working-directory: ./apps/msbross-frontend

    - name: Build Project
      run: npm run build
      working-directory: ./apps/msbross-frontend

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H 84.247.186.126 >> ~/.ssh/known_hosts

    - name: Deploy via Rsync
      run: |
        rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" ./apps/msbross-frontend/dist/ ${{ secrets.VPS_USER }}@84.247.186.126:/var/www/manuelalvarez/

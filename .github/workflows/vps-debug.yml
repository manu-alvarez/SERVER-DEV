name: VPS Remote Execution
on:
  push:
    paths:
      - '.github/workflows/vps-debug.yml'
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
    - name: Execute command on VPS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          echo "Conectado al VPS"
          docker ps
          cat ~/MSBrossAI/infrastructure/docker-compose.yml || echo "no docker-compose"
          cat ~/MSBrossAI/ecosystem.config.js || echo "no ecosystem"

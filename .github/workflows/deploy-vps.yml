name: Deploy VPS
on:
  # push trigger DISABLED — deployment runs on VPS via vps_deploy.sh
  # push:
  #   branches: [main]
  workflow_dispatch:

# Required secrets:
#   VPS_SSH_KEY, VPS_HOST, VPS_USER, GROQ_API_KEY

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/elitescout/package-lock.json

      - name: Build EliteScout
        working-directory: apps/elitescout
        run: |
          npm ci
          npm run build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Ensure directories
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /home/ubuntu/MSBrossAI/apps /home/ubuntu/MSBrossAI/infrastructure /home/ubuntu/MSBrossAI/logs"

      - name: Deploy Apps
        run: |
          rsync -avz --delete --no-perms \
            --exclude 'node_modules' --exclude 'dist' --exclude '.next' \
            --exclude '.git' --exclude '__pycache__' --exclude 'venv' --exclude '.venv' \
            --exclude '.env' --exclude '*.log' --exclude '*.error.log' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./apps/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/MSBrossAI/apps/

      - name: Deploy EliteScout Build (.next)
        run: |
          rsync -avz --delete --no-perms \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./apps/elitescout/.next/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/MSBrossAI/apps/elitescout/.next/

      - name: Deploy Static WWW
        run: |
          rsync -avz --delete --no-perms \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./www/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/MSBrossAI/www/

      - name: Deploy Infrastructure
        run: |
          rsync -avz -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./infrastructure/docker-compose.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/MSBrossAI/docker-compose.yml
          rsync -avz -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./ecosystem.config.js ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/MSBrossAI/ecosystem.config.js
          rsync -avz -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./infrastructure/msbross-proxy/proxy_server.js ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/MSBrossAI/proxy_server.js
          rsync -avz -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./infrastructure/msbross-proxy/favicon.png ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/MSBrossAI/favicon.png

      - name: Deploy Traefik Config
        run: |
          rsync -avz -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./infrastructure/traefik/docker-compose.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/MSBrossAI/infrastructure/traefik/docker-compose.yml

      - name: Reload Services
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/ubuntu/MSBrossAI

            echo "=== Installing EliteScout dependencies ==="
            cd /home/ubuntu/MSBrossAI/apps/elitescout && npm ci --omit=dev && cd /home/ubuntu/MSBrossAI

            echo "=== Rebuilding Docker images ==="
            docker build -t msbross-fitness:latest apps/txa-fitness-pro || echo "Build skipped: txa-fitness-pro"
            docker build -t msbross-mapfre:latest apps/mapfre/frontend || echo "Build skipped: mapfre"
            docker build -t msbross-perfume:latest apps/perfume-trading/erp || echo "Build skipped: perfume-trading"

            echo "=== Deploying Traefik ==="
            cd infrastructure/traefik && docker compose up -d && cd /home/ubuntu/MSBrossAI

            echo "=== Deploying Docker services ==="
            docker compose up -d --build

            echo "=== Reloading PM2 ==="
            pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js
            pm2 save

            echo "=== Cleanup old images ==="
            docker image prune -f

            echo "=== Deploy complete ==="

name: Deploy VPS
on:
  # push trigger DISABLED — deployment runs on VPS via vps_deploy.sh
  # push:
  #   branches: [main]
  workflow_dispatch:

# Required secrets:
#   VPS_SSH_KEY, VPS_HOST, VPS_USER, VPS_SSH_KNOWN_HOSTS, GROQ_API_KEY

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Match VPS host identity against a known fingerprint supplied out of band.
          # Never trust unauthenticated ssh-keyscan output during deployment.
          test -n "${{ secrets.VPS_SSH_KNOWN_HOSTS }}"
          printf '%s\n' "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/elitescout/package-lock.json

      - name: Build EliteScout
        working-directory: apps/elitescout
        run: |
          npm ci
          npm run build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Ensure directories
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /home/ubuntu/MSBrossAI/apps /home/ubuntu/MSBrossAI/infrastructure /home/ubuntu/MSBrossAI/logs"

      - name: Fix permissions before sync
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE_SCRIPT'
          sudo chattr -i /home/ubuntu/MSBrossAI/docker-compose.yml 2>/dev/null || true
          sudo chown -R $(id -un):$(id -un) /home/ubuntu/MSBrossAI/ || true
          REMOTE_SCRIPT

      - name: Deploy Apps
        run: |
          rsync -avz --delete --no-perms \
            --exclude 'node_modules' --exclude 'dist' --exclude '.next' \
            --exclude '.git' --exclude '__pycache__' --exclude 'venv' --exclude '.venv' \
            --exclude '.env' --exclude '*.log' --exclude '*.error.log' \
            --exclude 'storage' --exclude '*.db' --exclude '*.sqlite' --exclude '*.sqlite3' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            ./apps/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/MSBrossAI/apps/

      - name: Deploy EliteScout Build (.next)
        run: |
          rsync -avz --delete --no-perms \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            ./apps/elitescout/.next/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/MSBrossAI/apps/elitescout/.next/

      - name: Deploy Static WWW
        run: |
          rsync -avz --delete --no-perms \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            ./www/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/MSBrossAI/www/

      - name: Deploy Infrastructure
        run: |
          rsync -avz --inplace --no-perms -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            ./infrastructure/docker-compose.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/MSBrossAI/docker-compose.yml
          rsync -avz --inplace --no-perms -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            ./ecosystem.config.js ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/MSBrossAI/ecosystem.config.js
          rsync -avz --inplace --no-perms -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            ./infrastructure/msbross-proxy/proxy_server.js ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/MSBrossAI/proxy_server.js
          rsync -avz --inplace --no-perms -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            ./infrastructure/msbross-proxy/proxy_server.js ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/MSBrossAI/infrastructure/msbross-proxy/proxy_server.js

      - name: Deploy Traefik Config
        run: |
          rsync -avz --no-perms -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            ./infrastructure/traefik/docker-compose.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/MSBrossAI/infrastructure/traefik/docker-compose.yml

      - name: Reload Services
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          timeout 30m ssh -i ~/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE_SCRIPT'
          cd /home/ubuntu/MSBrossAI

          echo "=== Installing EliteScout dependencies ==="
          cd /home/ubuntu/MSBrossAI/apps/elitescout && npm ci --omit=dev && cd /home/ubuntu/MSBrossAI

          echo "=== Rebuilding Docker images ==="
          docker build -t msbross-fitness:latest apps/txa-fitness-pro || echo "Build skipped: txa-fitness-pro"
          docker build -t msbross-mapfre:latest apps/mapfre/frontend || echo "Build skipped: mapfre"
          docker build -t msbross-perfume:latest apps/perfume-trading/erp || echo "Build skipped: perfume-trading"

          echo "=== Deploying Traefik ==="
          cd infrastructure/traefik && docker compose up -d && cd /home/ubuntu/MSBrossAI

          echo "=== Deploying Docker services ==="
          docker rm -f msbross-proxy 2>/dev/null || true
          docker compose up -d --build msbross-proxy
          docker compose up -d --build || true

          echo "=== Restarting Traefik to refresh routes & certificates ==="
          cd infrastructure/traefik && docker compose restart && cd /home/ubuntu/MSBrossAI
          sleep 5
          docker logs --tail 25 traefik

          echo "=== Reloading PM2 ==="
          pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js
          pm2 save

          echo "=== Cleanup old images ==="
          docker image prune -f

          echo "=== Deploy complete ==="
          REMOTE_SCRIPT


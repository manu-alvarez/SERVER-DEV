version: '3.8'

x-backend-common: &backend-common
  restart: unless-stopped
  networks:
    - msbross_net

services:
  msbross-proxy:
    image: node:22-alpine
    container_name: msbross-proxy
    <<: *backend-common
    working_dir: /app
    volumes:
      - /home/ubuntu/MSBrossAI:/app
    command: sh -c "npm install && node proxy_server.js"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - NODE_ENV=production

  # ---------------------------------------------------------
  # BASES DE DATOS (Restauradas)
  # ---------------------------------------------------------
  msbross-cuentos-db:
    image: postgres:16-alpine
    container_name: msbross-cuentos-db
    <<: *backend-common
    environment:
      POSTGRES_PASSWORD: dummy_ignored_by_volume
    volumes:
      - cuentos-pg-data:/var/lib/postgresql/data

  msbross-elitescout-db:
    image: postgres:16-alpine
    container_name: msbross-elitescout-db
    <<: *backend-common
    environment:
      POSTGRES_PASSWORD: dummy_ignored_by_volume
    volumes:
      - elitescout-pg-data:/var/lib/postgresql/data

  jartosdto-postgres:
    image: pgvector/pgvector:pg16
    container_name: jartosdto-postgres
    <<: *backend-common
    environment:
      POSTGRES_USER: jartosdto
      POSTGRES_PASSWORD: dummy_ignored_by_volume
      POSTGRES_DB: jartosdto
    volumes:
      - jartosdto-pg-data:/var/lib/postgresql/data

  jartosdto-redis:
    image: redis:7-alpine
    container_name: jartosdto-redis
    <<: *backend-common
    volumes:
      - jartosdto-redis-data:/data

  jartosdto-minio:
    image: minio/minio:latest
    container_name: jartosdto-minio
    <<: *backend-common
    environment:
      MINIO_ROOT_USER: jartosdto
      MINIO_ROOT_PASSWORD: dummy_ignored_by_volume
    volumes:
      - jartosdto-minio-data:/data
    command: server /data --console-address ":9001"

  # ---------------------------------------------------------
  # BACKENDS
  # ---------------------------------------------------------
  nikolina-api-hub:
    image: msbross-nikolina-backend:latest
    container_name: nikolina-api-hub
    <<: *backend-common
    volumes:
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/server:/app
    environment:
      - PORT=8001
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8001
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nikolina.rule=Host(`nikolina.manuelalvarez.dev`)"
      - "traefik.http.routers.nikolina.entrypoints=websecure"
      - "traefik.http.routers.nikolina.tls.certresolver=myresolver"
      - "traefik.http.services.nikolina.loadbalancer.server.port=8001"

  nikolina-agent:
    image: msbross-nikolina-backend:latest
    container_name: nikolina-agent
    <<: *backend-common
    volumes:
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/agent:/app
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/server:/server
    environment:
      - PYTHONPATH=/app/src:/server/src
    command: python src/agent.py start

  it-coach-agent:
    image: msbross-nikolina-backend:latest
    container_name: it-coach-agent
    <<: *backend-common
    volumes:
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/agent:/app
      - /home/ubuntu/MSBrossAI/apps/livekit-nikolina/server:/server
    environment:
      - PYTHONPATH=/app/src:/server/src
      - LIVEKIT_WORKER_PORT=8082
    command: python src/coach_agent.py start

  gas-station-backend:
    image: msbross-gas-station-backend:latest
    container_name: gas-station-backend
    <<: *backend-common
    volumes:
      - /home/ubuntu/MSBrossAI/apps/gas-station/backend:/app
    environment:
      - PORT=3005
    command: python -m uvicorn main:app --host 0.0.0.0 --port 3005

  iaputa-backend:
    image: msbross-iaputa-backend:latest
    container_name: iaputa-backend
    <<: *backend-common
    volumes:
      - /home/ubuntu/MSBrossAI/apps/iaputa-os/backend:/app
    environment:
      - PORT=8006
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8006

  msbross-backend:
    image: msbross-msbross:latest
    container_name: msbross-backend
    <<: *backend-common
    volumes:
      - /home/ubuntu/MSBrossAI/apps/msbross-os/backend:/app
    environment:
      - PORT=8005
    command: python server.py

  cuentos-magicos-backend:
    image: msbross-cuentos-magicos-backend:latest
    container_name: cuentos-magicos-backend
    <<: *backend-common
    volumes:
      - /home/ubuntu/MSBrossAI/apps/cuentos-magicos/backend:/app
    environment:
      - PORT=8007
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8007
    depends_on:
      - msbross-cuentos-db

  traductor-backend:
    image: node:22-alpine
    container_name: traductor-backend
    <<: *backend-common
    working_dir: /app
    volumes:
      - /home/ubuntu/MSBrossAI/apps/traductor-pro/server:/app
    environment:
      - PORT=8004
    command: sh -c "npm install && node server.js"

  industrialpro-backend:
    image: msbross-industrial-backend:latest
    container_name: industrialpro-backend
    <<: *backend-common
    volumes:
      - /home/ubuntu/MSBrossAI/apps/industrialpro/backend:/app
    environment:
      - PORT=8002
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8002

  elitescout-backend:
    image: msbross-elitescout-backend:latest
    container_name: elitescout-backend
    <<: *backend-common
    volumes:
      - /home/ubuntu/MSBrossAI/apps/elitescout/backend:/app
    environment:
      - PORT=8010
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8010
    depends_on:
      - msbross-elitescout-db

  jartosdto-backend:
    image: msbross-jartosdto-backend:latest
    container_name: jartosdto-backend
    <<: *backend-common
    volumes:
      - /home/ubuntu/MSBrossAI/apps/jartosdto/server:/app
    environment:
      - PORT=8009
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8009
    depends_on:
      - jartosdto-postgres
      - jartosdto-redis
      - jartosdto-minio

networks:
  msbross_net:
    external: true

volumes:
  cuentos-pg-data:
    external: true
  elitescout-pg-data:
    external: true
  jartosdto-pg-data:
    external: true
  jartosdto-redis-data:
    external: true
  jartosdto-minio-data:
    external: true

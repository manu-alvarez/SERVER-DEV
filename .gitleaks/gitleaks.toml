# Gitleaks Configuration — MSBrossAI
# https://github.com/gitleaks/gitleaks

title = "MSBrossAI Secret Scanner"

[allowlist]
description = "Allow known false positives"
paths = [
  ".gitleaks/",
  "node_modules/",
  "venv/",
  ".venv/",
  "__pycache__/",
  ".next/",
  "dist/",
  ".git/",
  # Deployed compiled frontends and sourcemaps shipped to browsers (build artifacts, public by design).
  "www/app/",
  "\\.js\\.map$",
  # LiteLLM local-macOS service config/docs (not deployed on VPS). Placeholder keys
  # (sk-litellm-proxy-..., sk-litellm-master-key) trip the loose env-secret rule constantly.
  "infrastructure/litellm/",
]
# Benign code identifiers that look like env-style secrets (minified/typed code artifacts).
regexes = [
  '''create_access_token''',
  '''startsAsVariableToken''',
  # UIEP runtime token in tests: assignment from a test identifier (value is a
  # throwaway string that never represents a real credential; the real token
  # lives only in the VPS deployment .env, which is gitignored).
  '''process\.env\.UIEP_RUNTIME_TOKEN''',
]

[[rules]]
id = "custom-high-entropy"
description = "High entropy strings (potential secrets)"
regex = '''(?i).*(?:key|token|secret|password|credential|auth).{0,20}['\"\`][A-Za-z0-9+/]{40,}['\"\`]'''
tags = ["high-entropy", "custom"]

[[rules]]
id = "custom-env-secret"
description = "Potential secret in .env or config files"
regex = '''(?i)(?:API_KEY|SECRET|PASSWORD|TOKEN|CREDENTIAL)\s*=\s*['\"]?[A-Za-z0-9_\-+/]{16,}'''
tags = ["env", "custom"]

[[rules]]
id = "custom-private-key"
description = "Detect private keys in code"
regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
tags = ["key", "private"]

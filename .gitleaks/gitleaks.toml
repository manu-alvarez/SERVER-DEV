# Gitleaks Configuration — MSBrossAI
# https://github.com/gitleaks/gitleaks

title = "MSBrossAI Secret Scanner"

[allowlist]
description = "Allow known false positives"
paths = [
  ".gitleaks/",
  "node_modules/",
  "venv/",
  ".venv/",
  "__pycache__/",
  ".next/",
  "dist/",
  ".git/",
]

[[rules]]
id = "custom-high-entropy"
description = "High entropy strings (potential secrets)"
regex = '''(?i).*(?:key|token|secret|password|credential|auth).{0,20}['\"\`][A-Za-z0-9+/]{40,}['\"\`]'''
tags = ["high-entropy", "custom"]

[[rules]]
id = "custom-env-secret"
description = "Potential secret in .env or config files"
regex = '''(?i)(?:API_KEY|SECRET|PASSWORD|TOKEN|CREDENTIAL)\s*=\s*['\"]?[A-Za-z0-9_\-+/]{16,}'''
tags = ["env", "custom"]

[[rules]]
id = "custom-private-key"
description = "Detect private keys in code"
regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
tags = ["key", "private"]
